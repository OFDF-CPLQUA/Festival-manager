<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PLW'APP">
<link rel="apple-touch-icon" href="IMG_5325.png">
<link rel="icon" type="image/png" href="IMG_5325.png">
<meta name="theme-color" content="#0a0a0a">
<title>PLEIN-LES-W'APP</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#1a1a1a;--surface2:#2a2a2a;--border:#333;--text:#f0ece4;--muted:#888;--accent:#E8730A;--accent2:#F5B800;--danger:#C8281E;--success:#2D8C3E}
body.light-mode{--bg:#e8e8e8;--surface:#f5f5f5;--surface2:#fafafa;--border:#c0c0c0;--text:#3a3a3a;--muted:#666}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:rgba(0,0,0,0)!important;touch-action:manipulation}
*:focus{outline:none!important}
body{font-family:'IBM Plex Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;height:100vh;display:flex;justify-content:center;align-items:stretch;padding:0;margin:0;overflow:hidden;transition:background .3s,color .3s}
.container{background:var(--surface);width:100%;height:100vh;overflow:hidden;display:flex;flex-direction:column;transition:background .3s}
.digicode-screen{padding:5vh 5vw;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;overflow-y:auto}
.login-logo{margin-bottom:20px;padding:15px;display:flex;justify-content:center;align-items:center;width:100%}
.login-logo img{max-width:min(350px,70vw);max-height:20vh;width:100%;height:auto;display:block;object-fit:contain;transition:transform .3s}
.login-logo img:hover{transform:scale(1.05)}
.pin-display{display:flex;gap:min(12px,3vw);justify-content:center;margin:3vh 0}
.pin-dot{width:min(14px,3vw);height:min(14px,3vw);border:2px solid var(--border);border-radius:50%;transition:all .2s;background:transparent}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);box-shadow:0 0 8px rgba(232,115,10,.6)}
.pin-dot.error{background:var(--danger);border-color:var(--danger)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:min(15px,3vw);max-width:min(400px,90vw);margin:0 auto 20px}
.key{background:#2D8C3E;border:1px solid #256b32;border-radius:6px;padding:0;min-height:70px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:clamp(1.8rem,7vw,2.4rem);font-weight:600;color:#fff;cursor:pointer;transition:background .6s ease,border-color .6s ease,transform .15s;font-family:'IBM Plex Mono',monospace}
.key:hover{background:#25723a;transform:translateY(-1px)}
.key:active{transform:scale(.95)}
.key.empty{background:transparent;border:none;cursor:default;pointer-events:none;transition:none}
.key.del{background:#1e6b2e;border-color:#174f22;font-size:1.2rem;transition:background .6s ease,border-color .6s ease,transform .15s}
.digicode-screen.key-yellow .key{background:#F5B800;border-color:#d4a000}
.digicode-screen.key-yellow .key.del{background:#d4a000;border-color:#b38900}
.digicode-screen.responsable-mode .key{background:#C8281E;border-color:#a81f18}
.digicode-screen.responsable-mode .key:hover{background:#a81f18}
.digicode-screen.responsable-mode .key.del{background:#9e1d16;border-color:#7a1510}
.digicode-screen.responsable-mode .key.empty{background:transparent;border:none}
.error-message{color:var(--danger);margin-top:15px;font-weight:500;min-height:20px;font-size:.8rem}
/* Toggle rôle */
.role-selector{display:flex;justify-content:center;margin:3vh 0}
.role-toggle{position:relative;width:min(320px,80vw);height:52px;cursor:pointer;user-select:none}
.role-toggle-track{position:absolute;inset:0;border-radius:26px;background:var(--surface2);border:2px solid #2D8C3E;display:flex;align-items:center;overflow:hidden;transition:border-color .6s}
.role-toggle-label{flex:1;text-align:center;font-size:.8rem;font-weight:700;font-family:'IBM Plex Mono',monospace;z-index:1;transition:color .3s;letter-spacing:.5px}
.role-toggle-label.left{color:#fff}
.role-toggle-label.right{color:var(--muted)}
.role-toggle-thumb{position:absolute;top:4px;left:4px;width:calc(50% - 4px);height:calc(100% - 8px);border-radius:22px;background:#2D8C3E;transition:left .6s cubic-bezier(.4,0,.2,1),background .6s ease;box-shadow:0 2px 8px rgba(45,140,62,.6)}
.role-toggle.responsable .role-toggle-thumb{left:calc(50%);background:#C8281E;box-shadow:0 2px 8px rgba(200,40,30,.6)}
.role-toggle.responsable .role-toggle-track{border-color:#C8281E;transition:border-color .6s}
.role-toggle.responsable .role-toggle-label.left{color:var(--muted)}
.role-toggle.responsable .role-toggle-label.right{color:#fff}
.role-toggle.sliding .role-toggle-thumb{background:#F5B800!important;box-shadow:0 2px 8px rgba(245,184,0,.6)!important}
@media(max-width:600px){.digicode-screen{padding:3vh 5vw}.login-logo img{max-width:min(250px,75vw);max-height:18vh}.keypad{max-width:80vw}}
</style>
</head>
<body>
<div class="container">
<div class="digicode-screen" id="digicodeScreen">
<div class="login-logo"><img src="LOGO_PLW_WHITE.png" alt="Plein Les Watts Festival" id="loginLogo" onclick="toggleDarkMode()" style="cursor:pointer"></div>
<div class="role-selector">
<div class="role-toggle" id="roleToggle" onclick="toggleRole()">
<div class="role-toggle-track">
<span class="role-toggle-label left">BÉNÉVOLE</span>
<span class="role-toggle-label right">RESPONSABLE</span>
</div>
<div class="role-toggle-thumb" id="roleThumb"></div>
</div>
</div>
<div class="pin-display">
<div class="pin-dot" id="dot1"></div>
<div class="pin-dot" id="dot2"></div>
<div class="pin-dot" id="dot3"></div>
<div class="pin-dot" id="dot4"></div>
<div class="pin-dot" id="dot5"></div>
<div class="pin-dot" id="dot6"></div>
</div>
<div class="keypad">
<button class="key" onclick="addDigit('1')">1</button>
<button class="key" onclick="addDigit('2')">2</button>
<button class="key" onclick="addDigit('3')">3</button>
<button class="key" onclick="addDigit('4')">4</button>
<button class="key" onclick="addDigit('5')">5</button>
<button class="key" onclick="addDigit('6')">6</button>
<button class="key" onclick="addDigit('7')">7</button>
<button class="key" onclick="addDigit('8')">8</button>
<button class="key" onclick="addDigit('9')">9</button>
<button class="key empty" disabled></button>
<button class="key" onclick="addDigit('0')">0</button>
<button class="key del" onclick="deleteDigit()">⌫</button>
</div>
<div class="error-message" id="errorMessage"></div>
</div>
</div>
<script>
const PIN_BENEVOLE='072026';
const PIN_RESPONSABLE='082026';
const EDIT_PIN='041986';
let currentPin='';
let currentRole='benevole';

function addDigit(d){
    if(currentPin.length<6){
        currentPin+=d;
        updatePinDisplay();
        if(currentPin.length===6) checkPin();
    }
}

function deleteDigit(){
    currentPin=currentPin.slice(0,-1);
    updatePinDisplay();
    document.getElementById('errorMessage').textContent='';
}

function updatePinDisplay(){
    for(let i=1;i<=6;i++){
        const dot=document.getElementById('dot'+i);
        dot.classList.toggle('filled',i<=currentPin.length);
        dot.classList.remove('error');
    }
}

function checkPin(){
    const correctPin=currentRole==='benevole'?PIN_BENEVOLE:PIN_RESPONSABLE;
    if(currentPin===correctPin||currentPin===EDIT_PIN){
        let role=currentPin===EDIT_PIN?'responsable':currentRole;
        let target='PLWapp.html?key='+currentPin+'&role='+role;
        window.location.href=target;
    } else {
        document.getElementById('errorMessage').textContent='CODE INCORRECT';
        for(let i=1;i<=6;i++) document.getElementById('dot'+i).classList.add('error');
        setTimeout(()=>{
            currentPin='';
            updatePinDisplay();
            document.getElementById('errorMessage').textContent='';
        },1200);
    }
}

function toggleRole(){
    const toggle=document.getElementById('roleToggle');
    const screen=document.getElementById('digicodeScreen');
    toggle.classList.add('sliding');
    screen.classList.add('key-yellow');
    setTimeout(()=>{
        toggle.classList.remove('sliding');
        screen.classList.remove('key-yellow');
        currentRole=currentRole==='benevole'?'responsable':'benevole';
        toggle.classList.toggle('responsable',currentRole==='responsable');
        screen.classList.toggle('responsable-mode',currentRole==='responsable');
    },400);
    currentPin='';
    updatePinDisplay();
    document.getElementById('errorMessage').textContent='';
}

function toggleDarkMode(){
    document.body.classList.toggle('light-mode');
    const isLight=document.body.classList.contains('light-mode');
    localStorage.setItem('theme',isLight?'light':'dark');
    const logo=document.getElementById('loginLogo');
    logo.src=isLight?'LOGO_PLW_BLACK.png':'LOGO_PLW_WHITE.png';
}

window.addEventListener('load',()=>{
    if(localStorage.getItem('theme')==='light'){
        document.body.classList.add('light-mode');
        document.getElementById('loginLogo').src='LOGO_PLW_BLACK.png';
    }
    // Support swipe sur le toggle
    const toggle=document.getElementById('roleToggle');
    let startX=0;
    toggle.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;},{passive:true});
    toggle.addEventListener('touchend',e=>{
        const diff=e.changedTouches[0].clientX-startX;
        if(Math.abs(diff)>30){
            const newRole=diff>0?'responsable':'benevole';
            if(newRole!==currentRole) toggleRole();
        }
    },{passive:true});
});
</script>
</body>
</html>
